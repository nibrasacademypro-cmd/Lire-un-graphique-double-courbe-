<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lire un graphique à double courbe - 3AC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f7ff, #f8fbff);
    color: #17324d;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 8px;
    color: #1261a0;
    font-size: 27px;
}

.header p {
    margin: 5px;
    font-size: 16px;
}

.prof {
    font-weight: bold;
    color: #16855b;
}

.objectif {
    background: #e8f5ff;
    border-left: 5px solid #1261a0;
    padding: 12px 15px;
    border-radius: 10px;
    margin: 20px 0;
}

.graph-box {
    background: white;
    border-radius: 18px;
    padding: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.graph-title {
    text-align: center;
    font-weight: bold;
    font-size: 19px;
    margin-bottom: 10px;
}

svg {
    width: 100%;
    height: auto;
    display: block;
}

.legend {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-weight: bold;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 7px;
}

.line-orange,
.line-blue {
    width: 25px;
    height: 4px;
    display: inline-block;
    border-radius: 4px;
}

.line-orange {
    background: #e67e22;
}
